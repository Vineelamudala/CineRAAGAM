# Cineraagam — production stack (self-hosted, free & open-source).
#
#   Internet ──► caddy (HTTPS, :80/:443) ──► app      (Next.js website)
#                                       ├─► auth     (/auth/v1    Supabase Auth / GoTrue)
#                                       ├─► rest     (/rest/v1    PostgREST)
#                                       └─► storage  (/storage/v1 Supabase Storage, audio files)
#   db (Postgres) is private. backups writes daily dumps to ./backups.
#
# Only Caddy publishes ports. Versions are pinned to what the test suite runs against.
# See ../DEPLOY.md for the step-by-step guide.

name: cineraagam

services:
  db:
    image: public.ecr.aws/supabase/postgres:17.12.0.002
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      JWT_EXP: 3600
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  auth:
    image: public.ecr.aws/supabase/gotrue:v2.198.0
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${PUBLIC_URL:?set in .env}/auth/v1
      GOTRUE_SITE_URL: ${PUBLIC_URL}
      GOTRUE_URI_ALLOW_LIST: ${PUBLIC_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      # Players: anonymous only. Other sign-ups are rejected by the auth hook.
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "true"
      GOTRUE_RATE_LIMIT_ANONYMOUS_USERS: ${ANON_SIGNUPS_PER_HOUR:-30}
      GOTRUE_RATE_LIMIT_HEADER: X-Forwarded-For   # Caddy sets the real client IP
      GOTRUE_HOOK_BEFORE_USER_CREATED_ENABLED: "true"
      GOTRUE_HOOK_BEFORE_USER_CREATED_URI: pg-functions://postgres/private/before_user_created
      # Admins: e-mail + password (created by the operator), optional TOTP 2-step verification.
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_PASSWORD_MIN_LENGTH: 12
      GOTRUE_PASSWORD_REQUIRED_CHARACTERS: "abcdefghijklmnopqrstuvwxyz:ABCDEFGHIJKLMNOPQRSTUVWXYZ:0123456789"
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "true"
      GOTRUE_MFA_MAX_ENROLLED_FACTORS: 10
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: 10
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: 150
      GOTRUE_RATE_LIMIT_VERIFY: 30
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  rest:
    image: public.ecr.aws/supabase/postgrest:v16.6
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_MAX_ROWS: 1000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: 3600
    networks: [internal]

  storage:
    image: public.ecr.aws/supabase/storage-api:v1.98.8
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      rest: { condition: service_started }
    environment:
      ANON_KEY: ${ANON_KEY:?set in .env}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:?set in .env}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
      S3_PROTOCOL_ENABLED: "false"
    volumes:
      - storage-data:/var/lib/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  # One-shot: applies supabase/migrations/*.sql in order (tracked like the Supabase CLI does).
  migrate:
    image: public.ecr.aws/supabase/postgres:17.12.0.002
    depends_on:
      db: { condition: service_healthy }
      auth: { condition: service_healthy }
      storage: { condition: service_healthy }
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ../supabase/migrations:/migrations:ro
      - ./scripts/migrate.sh:/migrate.sh:ro
    entrypoint: ["sh", "/migrate.sh"]
    restart: "no"
    networks: [internal]

  app:
    build:
      context: ..
      target: app
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${PUBLIC_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${ANON_KEY}
    image: cineraagam-app:latest
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      SUPABASE_INTERNAL_URL: http://caddy:8000
    networks: [internal]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [app, auth, rest, storage]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]

  # Daily database + audio backups into ./backups (copy that folder off the server!).
  backups:
    image: public.ecr.aws/supabase/postgres:17.12.0.002
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
      - storage-data:/storage:ro
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    healthcheck: { disable: true } # the image's own check expects a local Postgres
    networks: [internal]

  # Restore a backup, run on demand:  docker compose run --rm restore <stamp>
  restore:
    image: public.ecr.aws/supabase/postgres:17.12.0.002
    profiles: ["restore"]
    depends_on:
      db: { condition: service_healthy }
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups:ro
      - storage-data:/storage
      - ./scripts/restore.sh:/restore.sh:ro
    entrypoint: ["sh", "/restore.sh"]
    networks: [internal]

  # Operator tools, run on demand:  docker compose run --rm tools node scripts/admin.mjs create you@example.com
  tools:
    build:
      context: ..
      target: tools
    image: cineraagam-tools:latest
    profiles: ["tools"]
    environment:
      NEXT_PUBLIC_SUPABASE_URL: http://caddy:8000
      SUPABASE_SECRET_KEY: ${SERVICE_ROLE_KEY}
    networks: [internal]

volumes:
  db-data:
  storage-data:
  caddy-data:
  caddy-config:

networks:
  internal:
